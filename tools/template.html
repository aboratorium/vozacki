<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vozački test</title>
<meta name="theme-color" content="#1f5fae">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vozački">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: single-column trainer card under mode tabs. Road-sign blue accent on asphalt neutrals. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --fg:#17202b; --muted:#5b6878; --line:#d5dbe3;
  --accent:#1f5fae; --accent-ink:#ffffff; --ok:#1d7f4a; --ok-bg:#e3f4ea; --bad:#c2352b; --bad-bg:#fbe6e3;
  --hint:#fff4cc; --hint-ink:#5a4600;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171e; --surface:#1b222c; --fg:#e7ecf2; --muted:#93a0b0; --line:#2c3643;
  --accent:#5b9be6; --accent-ink:#0b1420; --ok:#5cc58b; --ok-bg:#16301f; --bad:#ef7a6f; --bad-bg:#3a1c19;
  --hint:#3a3212; --hint-ink:#f2dc8a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171e; --surface:#1b222c; --fg:#e7ecf2; --muted:#93a0b0; --line:#2c3643;
  --accent:#5b9be6; --accent-ink:#0b1420; --ok:#5cc58b; --ok-bg:#16301f; --bad:#ef7a6f; --bad-bg:#3a1c19;
  --hint:#3a3212; --hint-ink:#f2dc8a; color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.g{border-bottom:1.5px dotted var(--accent);cursor:pointer}
</style>
<style>/*TAILWIND*/</style>
</head><body>
<div class="font-body text-[15px] leading-relaxed py-3 pb-10">
<div class="max-w-xl mx-auto grid gap-3">
  <header class="flex items-baseline justify-between gap-2 flex-wrap">
    <h1 class="font-display font-bold text-[22px] leading-none uppercase tracking-wide m-0">Vozački test
      <span class="font-body font-medium text-[13px] text-muted normal-case tracking-normal ml-1">тренажёр, кат. B</span></h1>
    <span id="stat" class="font-display font-medium text-[13px] text-muted tabular-nums"></span>
  </header>
  <nav id="modes" class="flex gap-1.5 overflow-x-auto pb-0.5"></nav>
  <div id="sections" class="flex gap-1.5 flex-wrap"></div>
  <div class="h-1 bg-line rounded overflow-hidden"><i id="prog" class="block h-full bg-ok w-0 transition-all"></i></div>
  <main id="view"></main>
  <footer id="foot" class="text-xs text-muted"></footer>
</div>
</div>

<script>
const DATA = /*DATA*/[];
const GLOSS = /*GLOSS*/[];
const META = /*META*/{};

// ---- progress store: on this device only (localStorage), see docs/adr/0006 ----
let st = {}, exams = [], ruAlways = false, persisted = null;
try { st = JSON.parse(localStorage.getItem('vt-stats') || '{}'); exams = JSON.parse(localStorage.getItem('vt-exams') || '[]'); ruAlways = localStorage.getItem('vt-ru') === '1'; } catch(e) {}
const save = () => { try { localStorage.setItem('vt-stats', JSON.stringify(st)); localStorage.setItem('vt-exams', JSON.stringify(exams)); localStorage.setItem('vt-ru', ruAlways ? '1' : '0'); } catch(e) {} };

// v1.0 keyed stats by PDF order number; v1.1 uses a stable hash id (docs/adr/0010)
function migrateIds(obj) {
  const byLegacy = {}; DATA.forEach(q => { if (q.legacy != null) byLegacy[q.legacy] = q.id; });
  const out = {}; let moved = 0;
  for (const k in obj) { if (/^\d+$/.test(k) && byLegacy[k]) { out[byLegacy[k]] = obj[k]; moved++; } else out[k] = obj[k]; }
  return [out, moved];
}
{ const [m, moved] = migrateIds(st); if (moved) { st = m; save(); } }

// ---- spaced repetition (docs/adr/0012): box 0..3, next review after 0 / 1 / 3 / 7 days ----
const DAY = 864e5, GAPS = [0, 1, 3, 7];
const dayStart = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const dueAt = (box, t) => box === 0 ? t : dayStart(t) + GAPS[box] * DAY;
function upgradeSR(rec) {               // v1.1 records have no box/due yet
  if (rec.box == null) { rec.box = Math.min(rec.streak || 0, 3); rec.due = dueAt(rec.box, rec.t || Date.now()); }
  return rec;
}
{ let n = 0; for (const id in st) if (st[id].box == null) { upgradeSR(st[id]); n++; } if (n) save(); }
const isDue = q => { const r = st[q.id]; return !!r && r.right + r.wrong > 0 && r.due <= Date.now(); };
const isFlag = q => !!(st[q.id] && st[q.id].flag);
const seenQ = q => { const r = st[q.id]; return !!r && r.right + r.wrong > 0; };

if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(v => { persisted = v; }).catch(() => {});

// ---- backup: export to a file / restore from a file ----
async function exportProgress() {
  const body = JSON.stringify({ app: 'vozacki', v: 2, at: Date.now(), stats: st, exams, ru: ruAlways }, null, 1);
  const name = 'vozacki-progress-' + new Date().toISOString().slice(0, 10) + '.json';
  const file = new File([body], name, { type: 'application/json' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Прогресс Vozački' }); return 'ok'; } }
  catch (e) { if (e && e.name === 'AbortError') return 'cancel'; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); return 'ok';
}
function importProgress(text) {
  const d = JSON.parse(text);
  if (!d || d.app !== 'vozacki' || typeof d.stats !== 'object') throw new Error('Это не файл прогресса Vozački.');
  const [rs] = migrateIds(d.stats);
  for (const id in rs) if (!st[id] || (rs[id].t || 0) > (st[id].t || 0)) st[id] = upgradeSR(rs[id]);
  const seen = new Set(exams.map(e => e.at));
  (d.exams || []).forEach(e => { if (!seen.has(e.at)) exams.push(e); });
  exams.sort((x, y) => x.at - y.at);
  save();
  return Object.keys(rs).length;
}

const SECTIONS = [...new Set(DATA.map(q => q.sec))];
const MODES = [['learn','Учёба'],['due','Повтор'],['flag','Сложные'],['exam','Экзамен'],['stats','Прогресс'],['gloss','Словарь']];
let mode = 'learn', sec = 'all', queue = [], idx = 0, exam = null;

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const learned = q => (st[q.id]?.streak || 0) >= 2;
const isMistake = q => st[q.id] && st[q.id].wrong > 0 && !learned(q);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

// class sets
const PILL = 'shrink-0 rounded-full border px-3 py-1.5 font-medium cursor-pointer focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent';
const pill = on => PILL + (on ? ' bg-accent text-accent-ink border-accent' : ' bg-surface text-fg border-line');
const CARD = 'bg-surface border border-line rounded-xl p-3.5 grid gap-3 min-w-0';
const BTN = 'rounded-lg bg-accent text-accent-ink px-5 py-2.5 font-display font-bold uppercase tracking-wide cursor-pointer focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent';
const OPT = 'opt grid grid-cols-[24px_1fr] gap-2 w-full text-left rounded-lg border-[1.5px] border-line bg-surface px-3 py-2.5 cursor-pointer transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent disabled:cursor-default';
const NOTE = 'bg-hint text-hint-ink rounded-lg px-3 py-2.5 text-sm';
const RUC = 'ru text-muted text-sm mt-1';

const GRE = GLOSS.map((g, i) => ({ i, re: new RegExp('(^|[^\\p{L}])(' + g.p + '\\p{L}*)', 'giu') }));
function gloss(text) {
  const marks = [];
  GRE.forEach(({ i, re }) => { re.lastIndex = 0; let m;
    while ((m = re.exec(text))) { const s = m.index + m[1].length, e = s + m[2].length;
      if (!marks.some(k => s < k.e && e > k.s)) marks.push({ s, e, i }); } });
  marks.sort((a, b) => a.s - b.s);
  let out = '', p = 0;
  for (const k of marks) { out += esc(text.slice(p, k.s)) + `<span class="g" data-g="${k.i}" tabindex="0">${esc(text.slice(k.s, k.e))}</span>`; p = k.e; }
  return out + esc(text.slice(p));
}

function buildQueue() {
  let pool = DATA.filter(q => sec === 'all' || q.sec === sec);
  if (mode === 'due') pool = pool.filter(isDue).sort((a, b) => st[a.id].box - st[b.id].box);
  if (mode === 'flag') pool = pool.filter(isFlag);
  if (mode === 'learn') {      // new questions + not yet learned ones whose review time has come
    const nl = pool.filter(q => !seenQ(q) || (!learned(q) && isDue(q))); pool = nl.length ? nl : pool;
  }
  queue = mode === 'learn' || mode === 'due' ? pool : shuffle(pool.slice());
  if (mode === 'exam') {
    // proportional sample across sections, like the real ticket mix
    const N = Math.min(META.examN, pool.length), by = {};
    pool.forEach(q => (by[q.sec] = by[q.sec] || []).push(q));
    let pick = [];
    Object.values(by).forEach(arr => pick.push(...shuffle(arr.slice()).slice(0, Math.round(arr.length / pool.length * N))));
    const rest = shuffle(pool.filter(q => !pick.includes(q)));
    while (pick.length < N) pick.push(rest.pop());
    queue = shuffle(pick.slice(0, N)); exam = { pts: 0, max: 0, right: 0, wrong: [] };
  }
  idx = 0;
}

// ---- readiness (docs/adr/0013): last 5 exams + share of learned questions ----
function readiness() {
  const last = exams.slice(-5), n = last.length, passed = last.filter(e => e.pass).length;
  const avg = n ? Math.round(last.reduce((a, e) => a + e.score, 0) / n) : 0;
  const learnedPct = Math.round(DATA.filter(learned).length / DATA.length * 100);
  let level, text;
  if (n < 3) { level = 'none'; text = 'Мало данных'; }
  else if (passed >= 4 && avg >= 72 && learnedPct >= 80) { level = 'ready'; text = 'Готов'; }
  else if (passed >= 3) { level = 'almost'; text = 'Почти готов'; }
  else { level = 'early'; text = 'Рано'; }
  return { n, passed, avg, learnedPct, level, text };
}
const LEVEL_CLS = { none: 'text-muted', early: 'text-bad', almost: 'text-hint-ink bg-hint', ready: 'text-ok bg-ok-bg' };

function chrome() {
  const pool = DATA.filter(q => sec === 'all' || q.sec === sec);
  const n = pool.filter(learned).length;
  const rd = readiness();
  $('#stat').innerHTML = `выучено ${n} / ${pool.length} · <button id="rd-chip" class="rounded px-1.5 ${LEVEL_CLS[rd.level]}">${rd.text}</button>`;
  $('#rd-chip').onclick = () => { mode = 'stats'; render(); };
  $('#prog').style.width = (pool.length ? n / pool.length * 100 : 0) + '%';
  const cnt = { due: DATA.filter(isDue).length, flag: DATA.filter(isFlag).length };
  $('#modes').innerHTML = MODES.map(([k, t]) =>
    `<button data-m="${k}" aria-pressed="${k === mode}" class="${pill(k === mode)} text-sm">${cnt[k] ? `${t} · ${cnt[k]}` : t}</button>`).join('');
  const box = $('#sections');
  box.hidden = mode === 'gloss' || mode === 'stats';
  box.innerHTML = ['all', ...SECTIONS].map(s =>
    `<button data-s="${esc(s)}" aria-pressed="${s === sec}" class="${pill(s === sec)} text-[13px] !px-2.5 !py-1">${s === 'all' ? 'Все разделы' : esc(s)}</button>`).join('');
}

function render() {
  chrome();
  const v = $('#view');
  if (mode === 'stats') { v.innerHTML = statsView(); wireBackup(); return; }
  if (mode === 'gloss') {
    v.innerHTML = `<div class="${CARD}"><div class="grid gap-2.5 text-sm">${GLOSS.map(g =>
      `<div class="border-l-[3px] border-accent pl-2"><b>${esc(g.w)}</b> — ${esc(g.ru)}</div>`).join('')}</div></div>`;
    return;
  }
  if (idx >= queue.length) {
    if (mode === 'exam' && exam && queue.length) {
      v.innerHTML = `<div class="${CARD}">
        <div class="font-display font-medium text-xs uppercase tracking-widest text-muted">Результат экзамена</div>
        ${(() => { const sc = Math.round(exam.pts / exam.max * META.examPts), pass = sc >= META.examPass;
          return `<div class="flex items-baseline gap-3 flex-wrap"><span class="font-display font-bold text-5xl tabular-nums ${pass ? 'text-ok' : 'text-bad'}">${sc} / ${META.examPts}</span>
          <span class="font-display font-bold uppercase tracking-wide ${pass ? 'text-ok' : 'text-bad'}">${pass ? 'Сдал' : 'Не сдал'}</span></div>
          <div class="text-sm text-muted">Порог ${META.examPass} из ${META.examPts}. Верных ответов ${exam.right} из ${queue.length}.</div>`; })()}
        ${exam.wrong.length ? `<div class="grid gap-1.5 text-sm">${exam.wrong.map(q => `<div class="border-l-[3px] border-bad pl-2">${esc(q.q)}<div class="text-muted">${esc(q.qr || '')}</div></div>`).join('')}</div>` : '<div>Без ошибок.</div>'}
        <div><button class="${BTN}" id="again">Новый экзамен</button></div></div>`;
    } else {
      const empty = { due: 'На сегодня повторять нечего. Следующие вопросы вернутся по расписанию.', flag: 'Отмеченных вопросов нет. Нажми ☆ на вопросе, чтобы добавить его сюда.' }[mode] || 'Раздел пройден.';
      v.innerHTML = `<div class="${CARD} text-center text-muted py-8">${empty}
        <div><button class="${BTN}" id="again">Ещё раз</button></div></div>`;
    }
    $('#again').onclick = () => { buildQueue(); render(); };
    return;
  }
  const q = queue[idx];
  const showRu = ruAlways && mode !== 'exam';
  const perm = shuffle(q.o.map((_, i) => i));      // option order changes on every showing (docs/adr/0012)
  const opts = q.order ? '' : `<div class="grid gap-2">${perm.map((oi, pos) => { const o = q.o[oi];
    return `<button class="${OPT}" data-i="${oi}"><b class="font-display font-bold text-muted">${'ABC'[pos]}</b><span>${gloss(o.t)}<div class="${RUC}" ${showRu ? '' : 'hidden'}>${esc(o.r || '')}</div></span></button>`; }).join('')}</div>`;
  const nums = q.order ? [...q.order].sort() : [];
  const order = q.order ? `<div class="text-muted text-sm">Нажимайте номера ТС в порядке проезда</div>
    <div id="seq" class="font-display font-bold text-2xl tracking-[.2em] min-h-[28px] tabular-nums">&nbsp;</div>
    <div class="flex gap-2 flex-wrap items-center">${nums.map(n => `<button data-n="${n}" class="w-11 h-11 rounded-full border-[1.5px] border-line bg-surface font-display font-bold text-lg disabled:opacity-35">${n}</button>`).join('')}
    <button id="reset" class="h-11 px-4 rounded-lg border border-line text-muted font-display font-bold uppercase text-sm">Сброс</button></div>` : '';
  v.innerHTML = `<div class="${CARD}">
    <div class="flex justify-between items-center gap-2 font-display font-medium text-xs uppercase tracking-widest text-muted">
      <span>${esc(q.sec)} · ${idx + 1} / ${queue.length}</span>
      <span class="flex gap-1.5"><button id="flag" aria-pressed="${isFlag(q)}" aria-label="Отметить как сложный" class="rounded-md border border-line px-2 py-1 text-[15px] leading-none ${isFlag(q) ? 'text-hint-ink bg-hint' : 'text-muted'}">${isFlag(q) ? '★' : '☆'}</button>
      ${mode === 'exam' ? '' : `<button id="ru" aria-pressed="${showRu}" class="rounded-md border border-accent px-2.5 py-1 font-bold text-[13px] tracking-wider ${showRu ? 'bg-accent text-accent-ink' : 'text-accent'}">RU</button>`}</span></div>
    ${q.img ? `<div class="flex justify-center bg-white rounded-md overflow-hidden"><img src="${q.img}" alt="Иллюстрация к вопросу" class="max-h-[300px] object-contain"></div>` : ''}
    <div><p class="font-semibold text-[17px] leading-snug m-0">${gloss(q.q)}</p><div id="qru" class="${RUC}" ${showRu ? '' : 'hidden'}>${esc(q.qr || 'перевод появится в полной версии')}</div></div>
    <div id="gl" class="${NOTE} py-1.5" hidden></div>
    ${opts}${order}
    <div id="after"></div></div>`;
  wire(q);
}

function statsView() {
  const secs = SECTIONS.map(s => { const p = DATA.filter(q => q.sec === s); const l = p.filter(learned).length;
    const seen = p.filter(seenQ).length; return { s, n: p.length, l, seen, pct: Math.round(l / p.length * 100) }; });
  const tot = DATA.filter(learned).length, seen = DATA.filter(seenQ).length, mist = DATA.filter(isMistake).length;
  const last = exams.slice(-10).reverse();
  const passN = exams.filter(e => e.pass).length;
  const fmt = t => new Date(t).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const worst = DATA.filter(q => st[q.id] && st[q.id].wrong > 0).sort((a, b) => st[b.id].wrong - st[a.id].wrong).slice(0, 5);
  const rd = readiness();
  const rdLine = rd.n < 3 ? `Пройди ещё ${3 - rd.n} ${3 - rd.n === 1 ? 'пробный экзамен' : 'пробных экзамена'} — после трёх появится оценка.`
    : `Сдано ${rd.passed} из последних ${rd.n}, средний балл ${rd.avg} / ${META.examPts}, выучено ${rd.learnedPct}% вопросов.`;
  return `<div class="grid gap-3">
  <div class="${CARD}">
    <div class="flex justify-between items-baseline gap-2 flex-wrap"><span class="font-display font-medium text-xs uppercase tracking-widest text-muted">Готовность к экзамену</span>
      <span class="font-display font-bold uppercase tracking-wide rounded px-2 py-0.5 ${LEVEL_CLS[rd.level]}">${rd.text}</span></div>
    <div class="text-sm">${rdLine}</div>
    <div class="text-xs text-muted">«Готов» = сдано 4 из 5 последних экзаменов, средний балл от 72 и выучено от 80% вопросов. «Почти» = сдано 3 из 5.</div>
  </div>
  <div class="${CARD}">
    <div class="flex justify-between items-baseline gap-2 flex-wrap"><span class="font-display font-medium text-xs uppercase tracking-widest text-muted">Общий прогресс</span><span class="text-xs text-muted">на этом устройстве</span></div>
    <div class="grid grid-cols-3 gap-2 text-center">
      <div><div class="font-display font-bold text-3xl tabular-nums">${tot}</div><div class="text-xs text-muted">выучено из ${DATA.length}</div></div>
      <div><div class="font-display font-bold text-3xl tabular-nums">${seen}</div><div class="text-xs text-muted">видел</div></div>
      <div><div class="font-display font-bold text-3xl tabular-nums ${mist ? 'text-bad' : ''}">${mist}</div><div class="text-xs text-muted">в ошибках</div></div>
    </div>
    <div class="grid gap-2">${secs.map(x => `<div class="grid gap-1"><div class="flex justify-between text-sm"><span>${esc(x.s)}</span><span class="tabular-nums text-muted">${x.l} / ${x.n}</span></div>
      <div class="h-1.5 bg-line rounded overflow-hidden"><i class="block h-full bg-ok" style="width:${x.pct}%"></i></div></div>`).join('')}</div>
    <div class="text-xs text-muted">Вопрос считается выученным после двух верных ответов подряд. Повтор: ошибка — сегодня, верный ответ — через 1, 3, затем 7 дней.</div>
  </div>
  <div class="${CARD}">
    <div class="flex justify-between items-baseline"><span class="font-display font-medium text-xs uppercase tracking-widest text-muted">Экзамены</span><span class="text-sm tabular-nums text-muted">сдано ${passN} из ${exams.length}</span></div>
    ${last.length ? `<div class="grid gap-1.5">${last.map(e => `<div class="flex justify-between text-sm tabular-nums border-b border-line pb-1"><span class="text-muted">${fmt(e.at)}</span><span class="${e.pass ? 'text-ok' : 'text-bad'} font-semibold">${e.score} / ${META.examPts} · ${e.pass ? 'сдал' : 'не сдал'}</span></div>`).join('')}</div>`
      : '<div class="text-sm text-muted">Пробных экзаменов ещё не было. Начни во вкладке «Экзамен».</div>'}
  </div>
  <div class="${CARD}">
    <span class="font-display font-medium text-xs uppercase tracking-widest text-muted">Резервная копия</span>
    <div class="text-sm text-muted">Прогресс хранится только в этом телефоне. Сохрани копию в «Файлы» перед сменой телефона или очисткой Safari.</div>
    <div class="flex gap-2 flex-wrap"><button id="bk-save" class="${BTN}">Сохранить в файл</button>
      <label class="rounded-lg border border-line px-5 py-2.5 font-display font-bold uppercase tracking-wide text-muted cursor-pointer">Восстановить<input id="bk-load" type="file" accept="application/json,.json" class="hidden"></label></div>
    <div id="bk-msg" class="text-sm" hidden></div>
  </div>
  ${worst.length ? `<div class="${CARD}"><span class="font-display font-medium text-xs uppercase tracking-widest text-muted">Чаще всего ошибаюсь</span>
    <div class="grid gap-1.5 text-sm">${worst.map(q => `<div class="border-l-[3px] border-bad pl-2">${esc(q.qr || q.q)} <span class="text-muted tabular-nums">· ошибок ${st[q.id].wrong}</span></div>`).join('')}</div></div>` : ''}
  </div>`;
}

function wireBackup() {
  const msg = (t, ok) => { const m = $('#bk-msg'); m.textContent = t; m.className = 'text-sm ' + (ok ? 'text-ok' : 'text-bad'); m.hidden = false; };
  $('#bk-save').onclick = async () => { const r = await exportProgress(); if (r === 'ok') msg('Файл с прогрессом создан.', true); };
  $('#bk-load').onchange = e => { const f = e.target.files[0]; if (!f) return;
    f.text().then(t => { const n = importProgress(t); render(); setTimeout(() => msg(`Восстановлено записей: ${n}.`, true), 0); })
      .catch(err => msg((err && err.message) || 'Не удалось прочитать файл.', false)); };
}

function setRu(on) {
  document.querySelectorAll('#view .ru').forEach(e => e.hidden = !on);
  const b = $('#ru'); if (!b) return;
  b.setAttribute('aria-pressed', on);
  b.classList.toggle('bg-accent', on); b.classList.toggle('text-accent-ink', on); b.classList.toggle('text-accent', !on);
}

function finish(q, ok, picked) {
  const s = st[q.id] || (st[q.id] = { right: 0, wrong: 0, streak: 0 });
  upgradeSR(s);
  if (ok) { s.right++; s.streak++; s.box = Math.min(s.box + 1, 3); } else { s.wrong++; s.streak = 0; s.box = 0; }
  s.t = Date.now(); s.due = dueAt(s.box, s.t);
  if (mode === 'exam' && idx === queue.length - 1) {
    const w = q.sec === 'Ситуации' ? 2 : 1, pts = exam.pts + (ok ? w : 0), max = exam.max + w;
    const score = Math.round(pts / max * META.examPts); exams.push({ at: Date.now(), score, pass: score >= META.examPass, n: queue.length });
  }
  save();
  if (mode === 'exam') { const w = q.sec === 'Ситуации' ? 2 : 1; exam.max += w; if (ok) { exam.right++; exam.pts += w; } else exam.wrong.push(q); }
  if (!q.order) document.querySelectorAll('.opt').forEach(b => {
    const i = +b.dataset.i; b.disabled = true;
    if (q.o[i].ok) { b.classList.remove('border-line', 'bg-surface'); b.classList.add('border-ok', 'bg-ok-bg'); }
    else if (i === picked) { b.classList.remove('border-line', 'bg-surface'); b.classList.add('border-bad', 'bg-bad-bg'); }
  });
  if (mode !== 'exam') setRu(true);
  const right = q.order ? `<div>Правильно: <b>${[...q.order].join(' → ')}</b></div>` : '';
  $('#after').innerHTML = `<div class="grid gap-2.5">
    ${mode === 'exam' ? '' : `<div class="font-display font-bold uppercase tracking-wide ${ok ? 'text-ok' : 'text-bad'}">${ok ? 'Верно' : 'Неверно'}</div>${right}`}
    ${q.n && mode !== 'exam' ? `<div class="${NOTE}">${esc(q.n)}</div>` : ''}
    ${q.s && mode !== 'exam' ? `<div class="${NOTE}"><b>Правилник, ${esc(q.s.code)} «${esc(q.s.name)}».</b> ${esc(q.s.ru)}</div>` : ''}
    ${mode !== 'exam' ? `<div class="text-xs text-muted">${ok ? `Повторим ${['сегодня', 'завтра', 'через 3 дня', 'через неделю'][st[q.id].box]}.` : 'Вопрос вернётся в «Повтор» сегодня.'}</div>` : ''}
    ${q.f && mode !== 'exam' ? `<div class="${NOTE}"><b>Спорный ключ.</b> На экзамене отвечай как в ключе. ${esc(q.f)}</div>` : ''}
    <div class="flex justify-end"><button class="${BTN}" id="next">Дальше</button></div></div>`;
  $('#next').onclick = () => { idx++; render(); window.scrollTo({ top: 0 }); };
  $('#next').focus({ preventScroll: true });
  chrome();
}

function wire(q) {
  const ru = $('#ru');
  if (ru) ru.onclick = () => { ruAlways = ru.getAttribute('aria-pressed') !== 'true'; save(); setRu(ruAlways); };
  $('#flag').onclick = () => {
    const r = upgradeSR(st[q.id] || (st[q.id] = { right: 0, wrong: 0, streak: 0, t: Date.now() }));
    r.flag = !r.flag; save();
    const b = $('#flag'); b.textContent = r.flag ? '★' : '☆'; b.setAttribute('aria-pressed', r.flag);
    b.classList.toggle('text-hint-ink', r.flag); b.classList.toggle('bg-hint', r.flag); b.classList.toggle('text-muted', !r.flag);
    chrome();
  };
  document.querySelectorAll('#view .g').forEach(el => {
    const show = ev => { ev.stopPropagation(); const g = GLOSS[el.dataset.g]; const box = $('#gl');
      box.innerHTML = `<b>${esc(g.w)}</b> — ${esc(g.ru)}`; box.hidden = false; };
    el.addEventListener('click', show);
    el.addEventListener('keydown', e => { if (e.key === 'Enter') show(e); });
  });
  if (!q.order) {
    document.querySelectorAll('.opt').forEach(b => b.onclick = e => {
      if (e.target.closest('.g')) return;
      const i = +b.dataset.i; finish(q, q.o[i].ok, i);
    });
  } else {
    let seq = '';
    const upd = () => { $('#seq').innerHTML = seq ? [...seq].join(' → ') : '&nbsp;'; };
    document.querySelectorAll('[data-n]').forEach(b => b.onclick = () => {
      seq += b.dataset.n; b.disabled = true; upd();
      if (seq.length === q.order.length) { document.querySelectorAll('[data-n],#reset').forEach(x => x.disabled = true); finish(q, seq === q.order); }
    });
    $('#reset').onclick = () => { seq = ''; upd(); document.querySelectorAll('[data-n]').forEach(x => x.disabled = false); };
  }
}

$('#modes').onclick = e => { const b = e.target.closest('button'); if (!b) return; mode = b.dataset.m; buildQueue(); render(); };
$('#sections').onclick = e => { const b = e.target.closest('button'); if (!b) return; sec = b.dataset.s; buildQueue(); render(); };
$('#foot').textContent = META.foot || '';
buildQueue(); render();
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body></html>
